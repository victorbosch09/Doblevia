<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Doble Vía</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<div id="toast"></div>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">Doble Vía</div>
    <div class="tx2 f13">Aprende, practica y valida tus dos carreras</div>

    <div id="lp-pick" class="mt24">
      <div class="label" id="lp-sub">¿Quién estudia hoy?</div>
      <div class="user-grid" id="user-grid"></div>
    </div>

    <div id="lp-pin" class="center mt24" style="display:none">
      <div id="lp-pin-av"></div>
      <div class="fw7 mt8" style="font-family:var(--fd);font-size:17px" id="lp-pin-name"></div>
      <div class="tx2 f13">Ingresa tu PIN</div>
      <div class="pin-dots" id="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
      <div class="pin-grid">
        <button class="pin-key" onclick="pinKey('1')">1</button><button class="pin-key" onclick="pinKey('2')">2</button><button class="pin-key" onclick="pinKey('3')">3</button>
        <button class="pin-key" onclick="pinKey('4')">4</button><button class="pin-key" onclick="pinKey('5')">5</button><button class="pin-key" onclick="pinKey('6')">6</button>
        <button class="pin-key" onclick="pinKey('7')">7</button><button class="pin-key" onclick="pinKey('8')">8</button><button class="pin-key" onclick="pinKey('9')">9</button>
        <span></span><button class="pin-key" onclick="pinKey('0')">0</button><button class="pin-key" onclick="pinBack()">⌫</button>
      </div>
      <div class="err-msg" id="pin-err"></div>
      <button class="btn-link" onclick="loginStep('pick')">← Elegir otra cuenta</button>
    </div>

    <div id="lp-new" class="mt24" style="display:none">
      <h3 class="mb16">Crear cuenta</h3>
      <div class="col">
        <div><div class="label mb8">Tu nombre</div><input class="input" id="na-name" maxlength="24" placeholder="Ej. Victor"></div>
        <div><div class="label mb8">PIN de 4 números</div><input class="input" id="na-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key==='Enter')createAccount()"></div>
        <div><div class="label mb8">Color</div><div class="swatches" id="swatches"></div></div>
        <div class="err-msg" id="na-err"></div>
        <button class="btn btn-p btn-block" onclick="createAccount()">Crear cuenta</button>
        <button class="btn-link" onclick="loginStep('pick')">← Volver</button>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav id="sidebar">
    <div class="sb-logo">Doble Vía</div>
    <div id="side-nav"></div>
    <div class="sb-spacer"></div>
    <div class="sb-user" id="sb-user" onclick="go('profile')"></div>
  </nav>

  <div id="main">
    <header id="topbar">
      <span class="pill click" id="tb-career" onclick="setCareer(P.career==='a'?'b':'a')" title="Cambiar de carrera"></span>
      <span class="tb-spacer"></span>
      <span class="pill fire" id="tb-streak" title="Racha de días"></span>
      <span class="pill xp" id="tb-xp" title="XP total"></span>
      <span class="pill lvl hide-m" id="tb-lvl"></span>
      <span class="pill" id="tb-goal" title="Meta diaria"></span>
      <span class="pill click" id="tb-pomo" onclick="togglePomo()" title="Pomodoro">⏱</span>
    </header>

    <section class="screen" id="s-home"></section>
    <section class="screen full" id="s-subject"></section>
    <section class="screen full" id="s-lesson"></section>
    <section class="screen full" id="s-quiz"></section>
    <section class="screen full" id="s-result"></section>
    <section class="screen full" id="s-cards"></section>
    <section class="screen" id="s-review"></section>
    <section class="screen full" id="s-glossary"></section>
    <section class="screen" id="s-progress"></section>
    <section class="screen full" id="s-profile"></section>
  </div>

  <nav id="mob-nav"></nav>
</div>

<!-- TOPIC SHEET -->
<div class="sheet-back" id="sheet-back"><div class="sheet" id="sheet"></div></div>

<!-- POMODORO -->
<div id="pomo">
  <div class="row mb8"><b class="grow" style="font-family:var(--fd)">🍅 Pomodoro</b><button class="xbtn" style="width:28px;height:28px;font-size:16px" onclick="togglePomo()">✕</button></div>
  <div class="pomo-mode"><button data-m="focus" onclick="setPomo('focus')">Enfoque</button><button data-m="short" onclick="setPomo('short')">Pausa</button><button data-m="long" onclick="setPomo('long')">Larga</button></div>
  <div class="pomo-t" id="pomo-t">25:00</div>
  <div class="row mt8" style="gap:8px"><button class="btn btn-p btn-sm grow" id="pomo-play" onclick="playPomo()">▶ Iniciar</button><button class="btn btn-g btn-sm" onclick="setPomo(PM.mode)">↺</button></div>
  <div class="f12 tx3 center mt8">25 min de foco · +5 XP al completar</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js" async onload="window.sbReady&&sbReady()"></script>
<script src="content/catalog.js?v=4" defer></script>
<script src="content/cp-1.js?v=4" defer></script>
<script src="content/cp-2.js?v=4" defer></script>
<script src="content/dr.js?v=4" defer></script>
<script src="content/sj.js?v=4" defer></script>
<script src="app.js?v=4" defer></script>
<script src="learn.js?v=4" defer></script>
</body>
</html>
